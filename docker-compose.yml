version: "3.8"

# Minimal local Supabase-compatible PostgreSQL setup.
# For full Supabase, use `npx supabase init && npx supabase start`.
# This compose provides just the database for development.

services:
  db:
    image: postgres:15-alpine
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql

volumes:
  pgdata:
